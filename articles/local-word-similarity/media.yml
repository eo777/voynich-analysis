figures:
  js-continuous:
    title: JS similarity · continuous · regular spacing
    src: images/js-continuous-comparison.png
    download: images/js-continuous-comparison.svg
    alt: JS similarity · continuous · regular spacing for Voynich, Towneley Creation, Aeneid, Rhazes,
      Galen, and Gart; observed, shuffled mean, and difference.
    caption: Within-line × exact-character-length shuffles. Row-specific scales remain fixed across spacing
      variants. Poetry uses intact source lines on independent pages. Differences are descriptive, not
      pixelwise significance tests.
