charts:
  continuous-method:
    title: How the continuous calculation uses word rectangles
    type: continuous-method
    data: data/continuous-method.json
    fallback: images/continuous-method.png
    caption: Actual f75r scan with registered boxes. Choose a source and compare candidate eligibility, word similarity, and positional weight. This is a worked illustration of one target, not a new statistical result.
  similarity-explorer:
    title: Explore local word similarity
    type: heatmap
    data: data/heatmaps.json
    fallback: images/js-continuous-comparison.png
    preset:
      corpus: voynich
      metric: js
      coordinates: continuous
      layout: regular
    caption: Select a text and metric to inspect observed similarity, the within-line shuffle mean, and
      the difference. The same native chart can appear inline or inside a gallery.
galleries:
  comparison-sheets:
    title: Six-text comparison sheets
    items:
    - figure:js-continuous
    - figure:js-discrete
    - figure:identity-continuous
    - figure:identity-discrete
    - figure:edit1-continuous
    - figure:edit1-discrete
    - figure:js-continuous-mild
    - figure:js-continuous-dispersed
    - figure:identity-continuous-mild
    - figure:identity-continuous-dispersed
    - figure:edit1-continuous-mild
    - figure:edit1-continuous-dispersed
    - chart:similarity-explorer
